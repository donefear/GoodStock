services:
  goodstock:
    build: .
    container_name: goodstock-kitchen
    restart: unless-stopped
    ports:
      - "8484:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      # Optional: set both values to enable recipe search from Mealie.
      MEALIE_URL: "${MEALIE_URL:-}"
      MEALIE_API_KEY: "${MEALIE_API_KEY:-}"
      # Optional: browser-facing Mealie address for "open in Mealie" links (defaults to MEALIE_URL).
      MEALIE_PUBLIC_URL: "${MEALIE_PUBLIC_URL:-}"
      # Optional: a second copy of the server backups (README → Features → Backups), for example on a NAS share. Set
      # BACKUP_COPY_PATH to a folder on the Docker host; it is mounted at /backup-copy below.
      BACKUP_COPY_DIR: "${BACKUP_COPY_PATH:+/backup-copy}"
    # Watched by the optional autoheal service below.
    labels:
      autoheal-goodstock: "true"
    volumes:
      - goodstock-data:/data
      - ${BACKUP_COPY_PATH:-goodstock-backup-copy}:/backup-copy

  # Optional HTTPS (README → HTTPS): turns on voice commands, browser notifications, barcode scanning in phone
  # browsers and the offline app. Starts only with the "https" profile: COMPOSE_PROFILES=https (in Portainer, a
  # stack environment variable), plus HTTPS_HOST set to the address the devices use. Then open
  # https://<HTTPS_HOST>:8443, after installing http://<HTTPS_HOST>:8485/goodstock-root.crt on each device.
  https:
    build: ./https
    profiles: ["https"]
    container_name: goodstock-https
    restart: unless-stopped
    depends_on:
      - goodstock
    ports:
      - "8443:443"
      - "8485:80"
    environment:
      HTTPS_HOST: "${HTTPS_HOST:-localhost}"
      HTTPS_CERT: "${HTTPS_CERT:-internal}"
      HTTPS_PORT: "8443"
    volumes:
      - goodstock-https:/data

  # Optional: restarts Goodstock when its health check fails (Docker itself only restarts a container that has
  # stopped, not one that hangs). Starts only with the "autoheal" profile, e.g. COMPOSE_PROFILES=autoheal or
  # COMPOSE_PROFILES=https,autoheal. It needs the Docker socket and only touches containers with the label above.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    profiles: ["autoheal"]
    container_name: goodstock-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal-goodstock
      AUTOHEAL_INTERVAL: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  goodstock-data:
  # Only used when BACKUP_COPY_PATH is not set (then nothing is copied there).
  goodstock-backup-copy:
  goodstock-https:
