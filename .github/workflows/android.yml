name: Android APK

on:
  push:
    branches: [main, standalone, experiments]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Optional. Without these the APK is signed with a throwaway debug key and cannot update an installed copy.
      GOODSTOCK_KEYSTORE_BASE64: ${{ secrets.GOODSTOCK_KEYSTORE_BASE64 }}
      GOODSTOCK_KEYSTORE_PASSWORD: ${{ secrets.GOODSTOCK_KEYSTORE_PASSWORD }}
      GOODSTOCK_KEY_ALIAS: ${{ secrets.GOODSTOCK_KEY_ALIAS }}
      GOODSTOCK_KEY_PASSWORD: ${{ secrets.GOODSTOCK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The Ubuntu runners come with the Android SDK (ANDROID_HOME), so no setup action is needed; the extra
      # android-actions/setup-android step started failing in 2026.
      - name: Check the Android SDK
        run: test -d "$ANDROID_HOME" && echo "Android SDK at $ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Use the release signing key
        if: env.GOODSTOCK_KEYSTORE_BASE64 != ''
        run: |
          echo "$GOODSTOCK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/goodstock.jks"
          echo "GOODSTOCK_KEYSTORE=$RUNNER_TEMP/goodstock.jks" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p android --no-daemon assembleRelease

      - name: Name the APK after the app version
        run: |
          VERSION=$(grep -oE 'Goodstock v[0-9]+\.[0-9]+(\.[0-9]+)?' index.html | head -1 | cut -d v -f 2)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Goodstock-v$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Goodstock-apk
          path: dist/*.apk

      - name: Attach the APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

  # Runs a debug build on an Android 14 emulator and checks what only a real system shows: the hosting service
  # (foreground, notification, locks, restart after a kill) and reminders scheduled again after a restart
  # (android/ci-emulator-check.sh). GitHub's Linux runners have KVM, which the emulator needs.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build a debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash android/ci-emulator-check.sh android/app/build/outputs/apk/debug/app-debug.apk
