name: iOS app

# Checks that the iPhone/iPad app builds: generates the Xcode project from ios/project.yml and compiles it for the
# simulator without signing. Installing on a phone happens from Xcode on a Mac (see ios/README.md).
on:
  push:
    branches: [main, standalone]
    paths:
      - 'ios/**'
      - '*.js'
      - '*.mjs'
      - 'index.html'
      - 'styles.css'
      - 'lang/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build for the simulator
        run: |
          xcodebuild -project ios/Goodstock.xcodeproj -scheme Goodstock -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0

      - name: Check the bundled web app
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path '*Debug-iphonesimulator/Goodstock.app' -type d | head -1)
          test -f "$APP/web/index.html" && test -f "$APP/web/lang/nl.js" && test -f "$APP/web/fonts/fonts.css"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
