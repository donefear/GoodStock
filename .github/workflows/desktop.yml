name: Desktop apps

# Builds Goodstock for Windows (portable .exe and installer), Linux (AppImage) and macOS (.dmg) with Electron
# (desktop/). Download them from the run's Artifacts; a tag also attaches them to its GitHub release.
on:
  push:
    branches: [main, experiments]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            name: windows
          - os: ubuntu-latest
            target: --linux
            name: linux
          - os: macos-latest
            target: --mac
            name: mac
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build
        env:
          # Signing is optional (desktop/README.md, "Signed builds"). With these repository secrets the Windows files
          # are signed and the Mac app is signed and notarized; without them the builds are unsigned and Windows and
          # macOS warn on first start.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm install --no-audit --no-fund
          VERSION=$(node prepare.mjs)
          if [ "${{ matrix.name }}" = mac ] && [ -n "$MAC_CSC_LINK" ]; then
            # A Developer ID certificate: drop the ad-hoc identity ("-") so electron-builder signs with it.
            export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));delete p.build.mac.identity;fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
            echo "Signing the Mac app${APPLE_ID:+ and notarizing it}."
          elif [ "${{ matrix.name }}" = windows ] && [ -n "$WIN_CSC_LINK" ]; then
            echo "Signing the Windows files."
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            echo "No signing certificate: an unsigned build."
          fi
          npx electron-builder ${{ matrix.target }} --publish never -c.extraMetadata.version="$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: Goodstock-${{ matrix.name }}
          path: |
            dist/desktop/*.exe
            dist/desktop/*.AppImage
            dist/desktop/*.dmg
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/desktop/*.exe
            dist/desktop/*.AppImage
            dist/desktop/*.dmg
