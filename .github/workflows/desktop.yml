name: Desktop apps

# Builds Goodstock for Windows (portable .exe and installer), Linux (AppImage) and macOS (.dmg) with Electron
# (desktop/). Download them from the run's Artifacts; a tag also attaches them to its GitHub release.
on:
  push:
    branches: [main, experiments]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            name: windows
          - os: ubuntu-latest
            target: --linux
            name: linux
          - os: macos-latest
            target: --mac
            name: mac
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build
        env:
          # No signing certificates: Windows and macOS warn on first start (see desktop/README.md).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          VERSION=$(node prepare.mjs)
          npx electron-builder ${{ matrix.target }} --publish never -c.extraMetadata.version="$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: Goodstock-${{ matrix.name }}
          path: |
            dist/desktop/*.exe
            dist/desktop/*.AppImage
            dist/desktop/*.dmg
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/desktop/*.exe
            dist/desktop/*.AppImage
            dist/desktop/*.dmg
